# Build and smoke-test the image for every PHP version and architecture.
# Nothing is pushed to Docker Hub.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: apache-php-dev
          build-args: PHP_VERSION=${{ matrix.php }}
          cache-from: type=gha,scope=php${{ matrix.php }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=php${{ matrix.php }}-${{ matrix.arch }}

      - name: Smoke test
        run: ./test.sh "${{ matrix.php }}"
